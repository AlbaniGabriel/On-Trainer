<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>On-Trainer — Criar Rotina</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;900&family=Barlow+Condensed:wght@700;900&display=swap" rel="stylesheet">
<style>

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --teal: #2ab5a0; --teal-dark: #1e8a78; --teal-light: #3fd6bf;
    --teal-dim: rgba(42,181,160,0.15);
    --bg: #0d1117; --card: #192028;
    --text: #e8f0f5; --text2: #8da0ae; --text3: #4a6070;
    --border: rgba(42,181,160,0.2); --red: #e05555;
    --font: 'Barlow', sans-serif; --font-cond: 'Barlow Condensed', sans-serif;
  }
  body { background: var(--bg); font-family: var(--font); color: var(--text); min-height: 100vh; }

  /* ===== NAV ===== */
  .nav {
    background: #0a0e13; border-bottom: 1px solid var(--border);
    padding: 0 2rem; height: 58px;
    display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 100;
  }
  .nav-logo img {
    height: 36px; width: auto;
    filter: brightness(0) invert(1);
  }
  .nav-links { display: flex; gap: 2rem; align-items: center; }
  .nav-link {
    font-size: 13px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase;
    color: var(--text2); cursor: pointer; border: none; background: none; transition: color .2s;
  }
  .nav-link:hover, .nav-link.active { color: var(--teal); }
  .nav-right { display: flex; align-items: center; gap: 1rem; }
  .nav-user { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text2); cursor: pointer; }
  .avatar {
    width: 30px; height: 30px; border-radius: 50%;
    background: var(--teal-dim); border: 1.5px solid var(--teal);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; color: var(--teal);
  }
  .btn-checkin {
    background: var(--teal); color: #000; font-weight: 700; font-size: 12px;
    letter-spacing: 1px; text-transform: uppercase; border: none; border-radius: 6px;
    padding: 8px 16px; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: background .2s;
  }
  .btn-checkin:hover { background: var(--teal-light); }

  /* ===== SCREENS ===== */
  .screen { display: none; animation: fadeIn .2s ease; }
  .screen.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .page { max-width: 960px; margin: 0 auto; padding: 2rem 1.5rem; }

  /* ===== COMMON ===== */
  .section-title {
    font-family: var(--font-cond); font-weight: 900; font-size: 28px;
    letter-spacing: 1px; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 10px;
  }
  .section-title span { color: var(--teal); }
  .breadcrumb { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text2); margin-bottom: 1.5rem; }
  .breadcrumb span { cursor: pointer; }
  .breadcrumb span:hover { color: var(--teal); }
  .breadcrumb-sep { color: var(--text3); }
  .tag { background: var(--teal-dim); color: var(--teal); font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 20px; }

  /* ===== BUTTONS ===== */
  .btn-primary {
    background: var(--teal); color: #000; font-weight: 700; font-size: 13px;
    border: none; border-radius: 8px; padding: 10px 20px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px; transition: background .2s;
  }
  .btn-primary:hover { background: var(--teal-light); }
  .btn-ghost {
    background: transparent; color: var(--text2); font-weight: 600; font-size: 13px;
    border: 1px solid var(--border); border-radius: 8px; padding: 9px 18px; cursor: pointer; transition: all .2s;
  }
  .btn-ghost:hover { border-color: var(--teal); color: var(--teal); }
  .icon-btn {
    background: rgba(255,255,255,.05); border: none; border-radius: 6px;
    width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer; color: var(--text2); font-size: 14px; transition: all .2s;
  }
  .icon-btn:hover { background: var(--teal-dim); color: var(--teal); }
  .icon-btn.del:hover { background: rgba(224,85,85,.15); color: var(--red); }

  /* ===== FORM ===== */
  .form-card {
    background: linear-gradient(145deg, #192e32 0%, #162028 100%);
    border: 1px solid var(--border); border-radius: 14px; padding: 2rem; max-width: 600px;
  }
  .form-group { margin-bottom: 1.25rem; }
  .form-label { display: block; font-size: 12px; font-weight: 600; letter-spacing: .8px; text-transform: uppercase; color: var(--text2); margin-bottom: 6px; }
  .form-input {
    width: 100%; background: rgba(0,0,0,.3); border: 1px solid rgba(255,255,255,.1);
    border-radius: 8px; padding: 10px 14px; color: var(--text);
    font-family: var(--font); font-size: 14px; outline: none; transition: border-color .2s;
  }
  .form-input:focus { border-color: var(--teal); }
  .form-input::placeholder { color: var(--text3); }
  textarea.form-input { resize: vertical; min-height: 80px; }
  .form-select {
    width: 100%; background: rgba(0,0,0,.3); border: 1px solid rgba(255,255,255,.1);
    border-radius: 8px; padding: 10px 14px; color: var(--text);
    font-family: var(--font); font-size: 14px; outline: none; cursor: pointer; appearance: none; transition: border-color .2s;
  }
  .form-select:focus { border-color: var(--teal); }
  .form-select option { background: #1a2028; }
  .chips-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1);
    border-radius: 20px; padding: 6px 14px; font-size: 12px; font-weight: 600;
    cursor: pointer; transition: all .2s; color: var(--text2);
  }
  .chip.selected { background: var(--teal-dim); border-color: var(--teal); color: var(--teal); }
  .form-footer { display: flex; gap: 12px; margin-top: 1.5rem; }

  /* ===== ROTINAS ===== */
  .rotinas-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
  .rotinas-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1rem; }
  .rotina-card {
    background: linear-gradient(145deg, #1a2d32 0%, #162028 100%);
    border: 1px solid var(--border); border-radius: 12px; padding: 1.25rem;
    cursor: pointer; transition: border-color .2s, transform .15s; position: relative; overflow: hidden;
  }
  .rotina-card::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: var(--teal); border-radius: 12px 0 0 12px; }
  .rotina-card:hover { border-color: var(--teal); transform: translateY(-2px); }
  .rotina-card-name { font-weight: 700; font-size: 16px; margin-bottom: 4px; }
  .rotina-card-meta { font-size: 12px; color: var(--text2); margin-bottom: 1rem; }
  .rotina-card-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 1rem; }
  .rotina-card-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid rgba(255,255,255,.05); padding-top: 10px; }
  .rotina-card-count { font-size: 12px; color: var(--text2); }
  .rotina-actions { display: flex; gap: 6px; }

  /* ===== DETALHE ===== */
  .rotina-detail-header {
    background: linear-gradient(135deg, #19303a 0%, #162028 100%);
    border: 1px solid var(--border); border-radius: 14px;
    padding: 1.75rem 2rem; margin-bottom: 1.5rem;
    display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem;
  }
  .rotina-detail-name { font-family: var(--font-cond); font-weight: 900; font-size: 32px; letter-spacing: 1px; margin-bottom: 6px; }
  .rotina-detail-desc { font-size: 14px; color: var(--text2); margin-bottom: 12px; line-height: 1.5; }
  .stats-row { display: flex; gap: 1.5rem; }
  .stat-item { text-align: center; }
  .stat-num { font-size: 22px; font-weight: 700; color: var(--teal); }
  .stat-label { font-size: 11px; color: var(--text2); letter-spacing: .5px; }
  .exercicios-list { display: flex; flex-direction: column; gap: 10px; }
  .exercicio-item {
    background: var(--card); border: 1px solid rgba(255,255,255,.06);
    border-radius: 10px; padding: 1rem 1.25rem;
    display: flex; align-items: center; gap: 1rem; transition: border-color .15s;
  }
  .exercicio-item:hover { border-color: var(--border); }
  .ex-num {
    width: 32px; height: 32px; border-radius: 8px;
    background: var(--teal-dim); color: var(--teal);
    font-weight: 700; font-size: 13px;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .ex-info { flex: 1; }
  .ex-name { font-weight: 600; font-size: 14px; margin-bottom: 2px; }
  .ex-meta { font-size: 12px; color: var(--text2); }
  .ex-badge { background: rgba(255,255,255,.05); border-radius: 6px; padding: 4px 10px; font-size: 11px; color: var(--text2); font-weight: 600; }

  /* ===== ADD EXERCÍCIO ===== */
  .ex-catalog { display: flex; flex-direction: column; gap: 8px; max-height: 280px; overflow-y: auto; margin-bottom: 1.25rem; }
  .ex-catalog::-webkit-scrollbar { width: 4px; }
  .ex-catalog::-webkit-scrollbar-thumb { background: var(--teal-dark); border-radius: 4px; }
  .ex-catalog-item {
    background: rgba(0,0,0,.2); border: 1px solid rgba(255,255,255,.07);
    border-radius: 8px; padding: 10px 14px; cursor: pointer;
    display: flex; justify-content: space-between; align-items: center; transition: all .15s;
  }
  .ex-catalog-item:hover, .ex-catalog-item.selected { border-color: var(--teal); background: var(--teal-dim); }
  .ex-catalog-name { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
  .ex-catalog-group { font-size: 11px; color: var(--text2); }
  .check-icon { color: var(--teal); font-size: 16px; }
  .series-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }

  /* ===== CHECK-IN ===== */
  .checkin-wrap { display: flex; align-items: center; justify-content: center; min-height: calc(100vh - 58px); padding: 2rem; }
  .checkin-card {
    background: linear-gradient(145deg, #19303a 0%, #162028 100%);
    border: 1px solid var(--border); border-radius: 20px;
    padding: 3rem 2.5rem; max-width: 420px; width: 100%; text-align: center; position: relative; overflow: hidden;
  }
  .checkin-card::before { content: ''; position: absolute; top: -80px; right: -80px; width: 200px; height: 200px; border-radius: 50%; background: radial-gradient(circle, rgba(42,181,160,.12) 0%, transparent 70%); }
  .checkin-icon { width: 80px; height: 80px; border-radius: 50%; background: var(--teal-dim); border: 2px solid var(--teal); display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem; font-size: 36px; }
  .checkin-title { font-family: var(--font-cond); font-weight: 900; font-size: 28px; margin-bottom: 8px; }
  .checkin-sub { font-size: 14px; color: var(--text2); margin-bottom: 2rem; line-height: 1.5; }
  .checkin-info { background: rgba(0,0,0,.25); border-radius: 10px; padding: 1rem; margin-bottom: 1.5rem; text-align: left; }
  .checkin-info-row { display: flex; justify-content: space-between; font-size: 13px; padding: 4px 0; }
  .checkin-info-label { color: var(--text2); }
  .checkin-info-val { font-weight: 600; }
  .btn-confirm { width: 100%; background: var(--teal); color: #000; font-weight: 700; font-size: 15px; border: none; border-radius: 10px; padding: 14px; cursor: pointer; transition: background .2s; }
  .btn-confirm:hover { background: var(--teal-light); }
  .success-ring { width: 90px; height: 90px; border-radius: 50%; background: var(--teal-dim); border: 3px solid var(--teal); display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem; font-size: 40px; animation: popIn .4s cubic-bezier(.34,1.56,.64,1); }
  @keyframes popIn { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .confetti-dot { position: absolute; width: 6px; height: 6px; border-radius: 50%; animation: fall 1.2s ease forwards; }
  @keyframes fall { from { transform: translateY(-10px); opacity: 1; } to { transform: translateY(130px); opacity: 0; } }

  /* ===== HISTÓRICO ===== */
  .streak-banner {
    background: var(--teal-dim); border: 1px solid var(--border); border-radius: 10px;
    padding: 1rem 1.25rem; display: flex; align-items: center; gap: 14px; margin-bottom: 1.5rem;
  }
  .streak-num { font-size: 36px; font-weight: 900; color: var(--teal); font-family: var(--font-cond); }
  .streak-label { font-size: 13px; color: var(--text2); }
  .streak-label strong { color: var(--text); display: block; font-size: 15px; margin-bottom: 2px; }
  .filter-row { display: flex; gap: 8px; margin-bottom: 1.5rem; }
  .filter-btn { background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1); border-radius: 20px; padding: 6px 16px; font-size: 12px; font-weight: 600; color: var(--text2); cursor: pointer; transition: all .2s; }
  .filter-btn.active { background: var(--teal-dim); border-color: var(--teal); color: var(--teal); }
  .hist-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
  @media (max-width: 600px) { .hist-grid { grid-template-columns: 1fr; } }
  .cal-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 1.25rem; }
  .cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
  .cal-month { font-weight: 700; font-size: 15px; }
  .cal-nav { background: none; border: none; color: var(--text2); cursor: pointer; font-size: 16px; padding: 4px 8px; }
  .cal-nav:hover { color: var(--teal); }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-lbl { font-size: 10px; color: var(--text3); text-align: center; padding: 4px 0; font-weight: 600; }
  .cal-day { aspect-ratio: 1; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--text2); cursor: pointer; transition: background .15s; }
  .cal-day:hover { background: rgba(255,255,255,.05); }
  .cal-day.hit { background: var(--teal-dim); color: var(--teal); font-weight: 700; }
  .cal-day.today { border: 1px solid var(--teal); color: var(--teal); }
  .cal-day.empty { opacity: 0; pointer-events: none; }
  .list-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
  .list-card-header { padding: 1rem 1.25rem; border-bottom: 1px solid rgba(255,255,255,.05); font-weight: 700; font-size: 14px; }
  .ci-entry { display: flex; align-items: center; gap: 12px; padding: 12px 1.25rem; border-bottom: 1px solid rgba(255,255,255,.04); transition: background .15s; }
  .ci-entry:last-child { border-bottom: none; }
  .ci-entry:hover { background: rgba(255,255,255,.02); }
  .ci-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--teal); flex-shrink: 0; }
  .ci-info { flex: 1; }
  .ci-date { font-size: 13px; font-weight: 600; }
  .ci-time { font-size: 11px; color: var(--text2); }
  .stats-mini { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-top: 1.5rem; }
  .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 1rem; text-align: center; }
  .stat-card-num { font-size: 28px; font-weight: 900; color: var(--teal); font-family: var(--font-cond); }
  .stat-card-lbl { font-size: 12px; color: var(--text2); }

  /* ===== FOOTER ===== */
  footer { background: #080c10; border-top: 1px solid rgba(255,255,255,.05); padding: 1.25rem 2rem; display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--text3); flex-wrap: wrap; gap: 8px; }
  .footer-links { display: flex; gap: 1.5rem; }
  .footer-links a { color: var(--text3); text-decoration: none; }
  .footer-links a:hover { color: var(--teal); }

  /* ===== TOAST ===== */
  .toast { position: fixed; bottom: 2rem; right: 2rem; background: #1a2e28; border: 1px solid var(--teal); border-radius: 10px; padding: 12px 20px; font-size: 13px; font-weight: 600; color: var(--teal); z-index: 999; transform: translateY(20px); opacity: 0; transition: all .3s; pointer-events: none; }
  .toast.show { transform: translateY(0); opacity: 1; }
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-thumb { background: #2a3040; border-radius: 5px; }

  .screen { display: block; }

/* Fix footer position */
html { height: 100%; }
body { min-height: 100%; position: relative; padding-bottom: 60px; box-sizing: border-box; }
footer { position: absolute; bottom: 0; left: 0; right: 0; }
</style>
</head>
<body>
<nav class="nav">
  <div class="nav-logo">
    <svg height="34" viewBox="0 0 290 38" xmlns="http://www.w3.org/2000/svg">
      <path d="M 0 32 L 8 31 L 270 31 L 282 32" stroke="#2ab5a0" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.7"/>
      <path d="M 18 35 L 265 35 L 280 36" stroke="#2ab5a0" stroke-width="0.7" fill="none" stroke-linecap="round" opacity="0.35"/>
      <text x="2" y="28" font-family="Barlow Condensed, Barlow, sans-serif" font-weight="900" font-style="italic" font-size="27" letter-spacing="1.5" fill="#2ab5a0">ON-TRAINER</text>
    </svg>
  </div>
  <div class="nav-links">
    <a class="nav-link active" href="rotinas.html">Rotinas</a>
    <a class="nav-link " href="historico.html">Histórico</a>
  </div>
  <div class="nav-right">
    <div class="nav-user" onclick="logout()" style="cursor:pointer" title="Sair">
      <div class="avatar" id="nav-avatar">?</div>
      <span id="nav-username">...</span>
    </div>
    <a class="btn-checkin" href="checkin.html">Check-in ＋</a>

</nav>
<div class="page">
  <div class="breadcrumb"><span onclick="go('rotinas')" style="cursor:pointer">Rotinas</span><span class="breadcrumb-sep">›</span><span style="color:var(--text)" id="page-title">Nova Rotina</span></div>
  <div class="section-title">Criar <span>Rotina</span></div>
  <div class="form-card">
    <div id="err-msg" style="color:#e05555;font-size:13px;margin-bottom:8px;display:none"></div>
    <div class="form-group"><label class="form-label">Nome da rotina *</label><input class="form-input" id="inp-nome" type="text" placeholder="Ex: Treino de Perna"/></div>
    <div class="form-group"><label class="form-label">Descrição (opcional)</label><textarea class="form-input" id="inp-desc" placeholder="Descreva o objetivo desta rotina..." style="height:80px;resize:vertical"></textarea></div>

      <label class="form-label">Dia da semana</label>

        <option value="">Selecione um dia</option>

        <option value="3">Quarta-feira</option><option value="4">Quinta-feira</option>

      </select>

      <button class="btn-primary" id="btn-salvar">Criar e Adicionar Exercícios →</button>

</div>

<div class="toast" id="toast-el"></div>
<script>

const API = 'http://localhost:8080/api';
function getToken() { return localStorage.getItem('token'); }
function getUser() { try { return JSON.parse(localStorage.getItem('user')); } catch(e) { return null; } }
function logout() { localStorage.removeItem('token'); localStorage.removeItem('user'); window.location.href = 'login.html'; }
async function api(method, path, body) {
  const opts = { method, headers: { 'Content-Type': 'application/json' } };
  const token = getToken();
  if (token) opts.headers['Authorization'] = 'Bearer ' + token;
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(API + path, opts);
  if (res.status === 401) { logout(); return; }
  if (!res.ok) { const err = await res.json().catch(() => ({message: 'Erro desconhecido'})); throw new Error(err.message || 'Erro'); }
  if (res.status === 204) return null;
  return res.json();
}
function requireAuth() { if (!getToken()) { window.location.href = 'login.html'; return false; } return true; }
function toast(msg, isError) {
  const el = document.getElementById('toast-el');
  if (!el) return;
  el.textContent = (isError ? '✗ ' : '✓ ') + msg;
  el.style.background = isError ? '#e05555' : 'var(--teal,#2ab5a0)';
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2800);
}
function go(id) {
  const map = { 'rotinas':'rotinas.html','criar':'criar-rotina.html','detalhe':'detalhe-rotina.html','addex':'add-exercicio.html','checkin':'checkin.html','historico':'historico.html','login':'login.html' };
  if (map[id]) window.location.href = map[id];
}
function updateNav() {
  const user = getUser();
  const avatarEl = document.getElementById('nav-avatar');
  const nameEl = document.getElementById('nav-username');
  if (avatarEl && user) avatarEl.textContent = (user.username||'?').charAt(0).toUpperCase();
  if (nameEl && user) nameEl.textContent = (user.username||'') + ' ▾';
}


window.addEventListener('DOMContentLoaded', async () => {
  if (!requireAuth()) return;
  updateNav();
  // check if editing
  const editId = localStorage.getItem('editRoutineId');
  if (editId) {
    document.getElementById('page-title').textContent = 'Editar Rotina';
    document.querySelector('.section-title').innerHTML = 'Editar <span>Rotina</span>';
    document.getElementById('btn-salvar').textContent = 'Salvar Alterações';
    // load existing data
    try {
      const r = await api('GET', '/routines/' + editId);
      document.getElementById('inp-nome').value = r.name;
      document.getElementById('inp-desc').value = r.description || '';
      if (r.dayOfWeek !== null && r.dayOfWeek !== undefined)
        document.getElementById('inp-dia').value = r.dayOfWeek;
    } catch(e) {}
  }
});

document.getElementById('btn-salvar').addEventListener('click', async () => {
  const nome = document.getElementById('inp-nome').value.trim();
  const desc = document.getElementById('inp-desc').value.trim();
  const dia = document.getElementById('inp-dia').value;
  const errEl = document.getElementById('err-msg');
  errEl.style.display = 'none';
  if (!nome) { errEl.textContent = 'Informe o nome da rotina.'; errEl.style.display = 'block'; return; }
  const btn = document.getElementById('btn-salvar');
  btn.disabled = true; btn.textContent = 'Salvando...';
  try {
    const editId = localStorage.getItem('editRoutineId');
    let exercisesToKeep = [];
    if (editId) {
      // Load existing exercises before deleting
      try {
        const existing = await api('GET', '/routines/' + editId);
        exercisesToKeep = existing.exercises.map((e, i) => ({
          exerciseId: e.exercise.id,
          orderPosition: i + 1,
          targetSets: e.targetSets,
          targetReps: e.targetReps,
          targetWeight: e.targetWeight,
          notes: e.notes
        }));
      } catch(e) {}
      await api('DELETE', '/routines/' + editId);
      localStorage.removeItem('editRoutineId');
    }
    const body = { name: nome, description: desc || null, dayOfWeek: dia !== '' ? parseInt(dia) : null, exercises: exercisesToKeep };
    const r = await api('POST', '/routines', body);
    localStorage.setItem('routineId', r.id);
    toast('Rotina salva!');
    setTimeout(() => go('detalhe'), 600);
  } catch(e) {
    errEl.textContent = e.message; errEl.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Criar e Adicionar Exercícios →';
  }
});

</script>
</body></html>
