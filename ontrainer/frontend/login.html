<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>On-Trainer — Entrar</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --teal: #2ab5a0; --teal-light: #3fd6bf;
    --text: #e8f0f5; --text2: #8da0ae; --text3: #4a6070;
    --border: rgba(42,181,160,0.2);
  }
  body {
    font-family: 'Barlow', sans-serif;
    background: #0d1117;
    color: var(--text);
    min-height: 100vh;
    display: flex; flex-direction: column;
  }
  .bg-mesh {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(ellipse 60% 50% at 20% 30%, rgba(42,181,160,0.07) 0%, transparent 70%),
      radial-gradient(ellipse 50% 60% at 80% 70%, rgba(42,181,160,0.05) 0%, transparent 70%);
  }
  .auth-wrapper {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 2rem 1rem; gap: 1.25rem;
    position: relative; z-index: 1;
  }
  .logo-img { width: 160px; height: auto; }
  .auth-card {
    background: linear-gradient(145deg, #192e32 0%, #162028 60%, #111820 100%);
    border: 1px solid var(--border);
    border-radius: 16px; padding: 2rem 2.25rem;
    width: 100%; max-width: 360px;
    box-shadow: 0 24px 60px rgba(0,0,0,0.5);
  }
  .auth-title { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 24px; margin-bottom: 4px; }
  .auth-sub { font-size: 13px; color: var(--text2); margin-bottom: 1.5rem; line-height: 1.5; }
  .form-group { margin-bottom: .9rem; }
  .form-input {
    width: 100%; background: rgba(0,0,0,0.35);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px; padding: 11px 14px;
    color: var(--text); font-family: 'Barlow', sans-serif; font-size: 14px;
    outline: none; transition: border-color .2s, box-shadow .2s;
  }
  .form-input:focus { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(42,181,160,0.1); }
  .form-input::placeholder { color: var(--text3); }
  .forgot-link { display: block; text-align: right; font-size: 12px; color: var(--teal); margin-top: 5px; cursor: pointer; }
  .check-row { display: flex; align-items: flex-start; gap: 9px; margin-bottom: 8px; }
  .check-row input[type=checkbox] { width: 14px; height: 14px; margin-top: 2px; accent-color: var(--teal); flex-shrink: 0; }
  .check-row label { font-size: 11.5px; color: var(--text2); line-height: 1.4; }
  .check-row label a { color: var(--teal); text-decoration: none; }
  .btn-submit {
    width: 100%; background: var(--teal); color: #000;
    font-family: 'Barlow', sans-serif; font-weight: 700; font-size: 15px;
    border: none; border-radius: 8px; padding: 13px;
    cursor: pointer; margin-top: 1.1rem; transition: background .2s, transform .1s;
  }
  .btn-submit:hover { background: var(--teal-light); }
  .btn-submit:active { transform: scale(.98); }
  .auth-bottom { text-align: center; font-size: 13px; color: var(--text2); margin-top: 1.1rem; }
  .auth-bottom a { color: var(--teal); font-weight: 600; cursor: pointer; text-decoration: none; }
  .pwd-strength { display: flex; gap: 4px; margin-top: 6px; }
  .pwd-bar { flex: 1; height: 3px; border-radius: 2px; background: rgba(255,255,255,0.08); transition: background .3s; }
  .pwd-bar.ok { background: var(--teal); }
  .pwd-bar.warn { background: #f0c040; }
  .pwd-bar.bad { background: #e05555; }
  .success-icon {
    width: 54px; height: 54px; border-radius: 50%;
    background: rgba(42,181,160,0.1); border: 1.5px solid var(--teal);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; margin: 0 auto 1.1rem;
  }
  footer {
    position: relative; z-index: 1;
    background: rgba(8,12,16,0.8); border-top: 1px solid rgba(255,255,255,0.05);
    padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center;
    font-size: 11px; color: var(--text3); flex-wrap: wrap; gap: 8px;
  }
  .footer-links { display: flex; gap: 1.25rem; }
  .footer-links a { color: var(--text3); text-decoration: none; }
  .footer-links a:hover { color: var(--teal); }
  .social-icons { display: flex; gap: 10px; }
  .soc { color: var(--text3); font-size: 13px; cursor: pointer; }
  .soc:hover { color: var(--teal); }
</style>
</head>
<body>
<div class="bg-mesh"></div>
<div class="auth-wrapper">
  <svg height="38" viewBox="0 0 290 38" xmlns="http://www.w3.org/2000/svg" style="width:200px">
    <path d="M 0 32 L 8 31 L 270 31 L 282 32" stroke="#2ab5a0" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.7"/>
    <text x="2" y="28" font-family="Barlow Condensed, sans-serif" font-weight="900" font-style="italic" font-size="27" letter-spacing="1.5" fill="#2ab5a0">ON-TRAINER</text>
  </svg>
  <div class="auth-card">
    <div class="auth-title">Entrar</div>
    <div class="auth-sub">Bem-vindo de volta! Acesse sua conta.</div>
    <div id="err-msg" style="color:#e05555;font-size:13px;margin-bottom:8px;display:none"></div>
    <div class="form-group"><input class="form-input" id="inp-email" type="email" placeholder="Email"/></div>
    <div class="form-group">
      <input class="form-input" id="inp-senha" type="password" placeholder="Senha"/>
      <a class="forgot-link" href="reset.html">Esqueceu a senha?</a>
    </div>
    <button class="btn-submit" id="btn-login">Entrar</button>
    <div class="auth-bottom">Não tem conta? <a href="cadastro.html">Cadastre-se agora</a></div>
  </div>
</div>
<footer>
  <div class="footer-links"><a href="#">Sobre</a><a href="#">Pro</a><a href="#">News</a><a href="#">Apps</a></div>
  <div>© On-Trainer LTDA. Made by SENDALEROS in Santa Catarina Brasil.</div>
</footer>
<script>

const API = 'http://localhost:8080/api';

function getToken() { return localStorage.getItem('token'); }
function getUser() { try { return JSON.parse(localStorage.getItem('user')); } catch(e) { return null; } }
function setAuth(data) {
  localStorage.setItem('token', data.token);
  localStorage.setItem('user', JSON.stringify({id: data.userId, username: data.username, email: data.email}));
}
function logout() { localStorage.removeItem('token'); localStorage.removeItem('user'); window.location.href = 'login.html'; }

async function api(method, path, body) {
  const opts = { method, headers: { 'Content-Type': 'application/json' } };
  const token = getToken();
  if (token) opts.headers['Authorization'] = 'Bearer ' + token;
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(API + path, opts);
  if (res.status === 401) { logout(); return; }
  if (!res.ok) {
    const err = await res.json().catch(() => ({message: 'Erro desconhecido'}));
    throw new Error(err.message || 'Erro na requisição');
  }
  if (res.status === 204) return null;
  return res.json();
}

function requireAuth() {
  if (!getToken()) { window.location.href = 'login.html'; return false; }
  return true;
}

function toast(msg, isError) {
  const el = document.getElementById('toast-el');
  if (!el) return;
  el.textContent = (isError ? '✗ ' : '✓ ') + msg;
  el.style.background = isError ? '#e05555' : '#2ab5a0';
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2800);
}

function go(id) {
  const map = {
    'rotinas': 'rotinas.html', 'criar': 'criar-rotina.html',
    'detalhe': 'detalhe-rotina.html', 'addex': 'add-exercicio.html',
    'checkin': 'checkin.html', 'historico': 'historico.html', 'login': 'login.html'
  };
  if (map[id]) window.location.href = map[id];
}

function updateNav() {
  const user = getUser();
  const avatarEl = document.getElementById('nav-avatar');
  const nameEl = document.getElementById('nav-username');
  if (avatarEl && user) avatarEl.textContent = (user.username||'?').charAt(0).toUpperCase();
  if (nameEl && user) nameEl.textContent = user.username + ' ▾';
}

if (getToken()) window.location.href = 'rotinas.html';

document.getElementById('btn-login').addEventListener('click', async () => {
  const email = document.getElementById('inp-email').value.trim();
  const senha = document.getElementById('inp-senha').value;
  const errEl = document.getElementById('err-msg');
  errEl.style.display = 'none';
  if (!email || !senha) { errEl.textContent = 'Preencha email e senha.'; errEl.style.display = 'block'; return; }
  const btn = document.getElementById('btn-login');
  btn.textContent = 'Entrando...'; btn.disabled = true;
  try {
    const data = await api('POST', '/auth/login', {email, password: senha});
    setAuth(data);
    window.location.href = 'rotinas.html';
  } catch(e) {
    errEl.textContent = e.message; errEl.style.display = 'block';
    btn.textContent = 'Entrar'; btn.disabled = false;
  }
});

document.getElementById('inp-senha').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('btn-login').click();
});
</script>
</body></html>
