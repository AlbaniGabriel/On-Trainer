# =============================================
# OnTrainer - Configurações da Aplicação
# =============================================

spring.application.name=ontrainer

# ---- PostgreSQL ----
spring.datasource.url=jdbc:postgresql://localhost:5432/ontrainer
spring.datasource.username=ontrainer_user
spring.datasource.password=ontrainer_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---- JWT ----
app.jwt.secret=ThisIsAVerySecureSecretKeyForOnTrainerApplicationAtLeast256BitsLong!!
app.jwt.expiration-ms=86400000

# ---- Servidor ----
server.port=8080

# ---- Log ----
logging.level.com.ontrainer=INFO
